name: Fix Instagram story frames

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-instagram-stories.yml"

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create individual 9x16 story frames
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Image.open("social/story-marketplaces-1.png").convert("RGB")
          W, H = src.size
          xs = [round(i * W / 3) for i in range(4)]
          ys = [round(i * H / 3) for i in range(4)]
          selected = [1,2,3,4,5,6,9]

          out = Path("social/fixed-marketplaces")
          out.mkdir(parents=True, exist_ok=True)

          for n, idx in enumerate(selected, start=1):
              row = (idx - 1) // 3
              col = (idx - 1) % 3
              frame = src.crop((xs[col], ys[row], xs[col+1], ys[row+1]))
              frame = frame.resize((1080, 1920), Image.Resampling.LANCZOS)
              frame.save(out / f"story-{n:02d}.jpg", quality=95, optimize=True)
          PY
      - name: Commit corrected frames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/fixed-marketplaces
          git diff --cached --quiet && exit 0
          git commit -m "Create corrected individual Instagram story frames"
          git push
