name: Package REG.RU test site
on:
  push:
    branches:
      - yandex-static
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove deployment-only files
        run: |
          rm -rf .git .github
          rm -f README.md vercel.json
      - name: Upload ready site
        uses: actions/upload-artifact@v4
        with:
          name: advokat-strelkov-reg-test
          path: |
            .
          include-hidden-files: true
          retention-days: 7
